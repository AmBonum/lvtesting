name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
        # TODO: remove continue-on-error once the pre-existing lint errors
        # (src/__tests__/*, src/app/error.tsx, global-error.tsx, i18n/provider.tsx,
        # lib/ConsentProvider.tsx) are fixed. Until then lint is reported, not enforced.
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build (static export + post-build rename _next -> assets)
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

